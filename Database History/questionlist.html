<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questions Sanctuary • Heartfelt Reflections</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Montserrat:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ================= GLOBAL ================= */
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Montserrat', sans-serif;
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;
  transition: background 0.8s ease;
  position: relative;
}

/* Theme Variables */
:root {
  --accent: #ffd700;
  --glow: rgba(255, 215, 0, 0.4);
}

/* AMOLED Deep Dark */
body.amoled {
  background: #000;
  --accent: #ffcc00;
}
body.amoled .stat-card {
  background: rgba(20,20,20,0.95);
  border: 1px solid #333;
}

/* Warm Golden-Brown Heart-Touching */
body.warm {
  background: linear-gradient(135deg, #3a2a1f, #8c5a2b, #d4a017);
  --accent: #ffeb99;
}
body.warm .stat-card {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,215,0,0.3);
}

/* Clean Light */
body.light {
  background: linear-gradient(135deg, #f5f0e6, #e8d9c2);
  color: #222;
  --accent: #b8860b;
}
body.light .stat-card {
  background: rgba(255,255,255,0.95);
  color: #222;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
body.light h1, body.light h2 { color: #3a2a1f; }

/* Background Particles */
.particles {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  overflow: hidden;
}
.particle {
  position: absolute;
  background: var(--accent);
  border-radius: 50%;
  opacity: 0.15;
  animation: floatParticle 25s linear infinite;
}

/* Navigation */
.nav-buttons {
  display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; justify-content: center; z-index: 10;
  position: relative;
}
.nav-buttons button {
  background: rgba(255,255,255,0.1);
  border: none; padding: 12px 24px; font-size: 1em; border-radius: 50px;
  cursor: pointer; font-weight: 600; color: #fff; transition: all 0.4s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}
body.light .nav-buttons button { color:#222; background: rgba(0,0,0,0.08); }
.nav-buttons button:hover {
  transform: translateY(-3px) scale(1.08);
  box-shadow: 0 0 25px var(--glow);
}

/* Theme Switcher */
.theme-switcher {
  position: fixed; top: 20px; right: 20px; z-index: 100;
  display: flex; gap: 8px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 50px;
  backdrop-filter: blur(12px);
}
.theme-btn {
  width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
  font-size: 1.3em; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease;
}
.theme-btn:hover { transform: scale(1.2); }

/* Header */
h1 {
  text-align: center; font-family: 'Playfair Display', serif; font-size: 3.2em;
  margin: 20px 0 10px; text-shadow: 0 0 20px var(--glow);
  animation: fadeInDown 1.2s ease;
}

/* Sidebar */
.sidebar {
  position: fixed; left: -320px; top: 0; width: 320px; height: 100vh;
  background: rgba(0,0,0,0.92); backdrop-filter: blur(16px);
  transition: left 0.5s cubic-bezier(0.4,0,0.2,1); z-index: 200;
  padding: 30px 25px; overflow-y: auto; box-shadow: 5px 0 30px rgba(0,0,0,0.6);
}
body.light .sidebar { background: rgba(245,240,230,0.98); color:#222; }
.sidebar.open { left: 0; }
.sidebar-toggle {
  position: fixed; left: 20px; top: 20px; z-index: 201;
  background: rgba(255,255,255,0.15); border: none; width: 50px; height: 50px;
  border-radius: 50%; font-size: 1.6em; cursor: pointer; color: #fff;
}
body.light .sidebar-toggle { background: rgba(0,0,0,0.1); color:#222; }

/* Search & Controls */
.controls {
  display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin: 20px 0; z-index: 10;
}
.search-bar {
  padding: 14px 20px; width: 320px; border-radius: 50px; border: none;
  background: rgba(255,255,255,0.1); color: #fff; font-size: 1.05em;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
body.light .search-bar { background: #fff; color:#222; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

/* Stats Container */
.stats-container {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px; max-width: 1280px; margin: 0 auto; padding: 20px; position: relative; z-index: 5;
}

/* Question Cards */
.stat-card {
  background: rgba(255,255,255,0.08); backdrop-filter: blur(14px);
  border-radius: 24px; padding: 28px 32px; transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
  cursor: pointer; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.1);
}
body.light .stat-card { border-color: rgba(184,134,11,0.2); }
.stat-card:hover {
  transform: translateY(-14px) scale(1.04) rotate(1deg);
  box-shadow: 0 25px 50px var(--glow);
}
.stat-card::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 80px; height: 200%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.25), transparent);
  transform: skewX(-25deg); transition: 0.7s; opacity: 0;
}
.stat-card:hover::before { left: 120%; opacity: 1; }

.stat-card h2 {
  font-family: 'Playfair Display', serif; font-size: 1.55em; margin-bottom: 12px;
  color: var(--accent);
}
.stat-card p { line-height: 1.5; margin-bottom: 16px; font-size: 1.05em; }
.stat-card small { opacity: 0.85; font-size: 0.9em; }

/* Magic Sparkle Trail (AMOLED only) */
#sparkle-trail {
  position: fixed; pointer-events: none; z-index: 9999; width: 100%; height: 100%; top:0; left:0;
}

/* Group Headers */
.group-header {
  grid-column: 1 / -1; font-size: 1.6em; margin: 30px 0 15px; padding-left: 10px;
  border-bottom: 2px solid var(--accent); padding-bottom: 8px; font-family: 'Playfair Display', serif;
}

/* Animations */
@keyframes fadeInDown { from {opacity:0; transform:translateY(-40px);} to {opacity:1; transform:translateY(0);} }
@keyframes floatParticle {
  0% { transform: translateY(100vh) scale(0.6); opacity: 0.1; }
  100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
}
</style>
</head>
<body class="amoled">

<!-- Particles -->
<div class="particles" id="particles"></div>

<!-- Sparkle Trail -->
<canvas id="sparkle-trail"></canvas>

<!-- Sidebar Toggle -->
<button class="sidebar-toggle" onclick="toggleSidebar()" title="Self-Help Guide"><i class="fas fa-book-open"></i></button>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <h2 style="margin-bottom:20px; color:var(--accent);"><i class="fas fa-heart"></i> Self-Help Sanctuary</h2>
  <div id="help-content">
    <p><strong>Welcome, dear friend.</strong> This space is for gentle reflection.</p>
    <div onclick="showHelpSection(1)" style="cursor:pointer;margin:15px 0;padding:12px;background:rgba(255,255,255,0.1);border-radius:12px;">
      <strong>1. Understanding Emotional Value</strong>
    </div>
    <div onclick="showHelpSection(2)" style="cursor:pointer;margin:15px 0;padding:12px;background:rgba(255,255,255,0.1);border-radius:12px;">
      <strong>2. How to Use This Dashboard</strong>
    </div>
    <div onclick="showHelpSection(3)" style="cursor:pointer;margin:15px 0;padding:12px;background:rgba(255,255,255,0.1);border-radius:12px;">
      <strong>3. Daily Reflection Tips</strong>
    </div>
  </div>
</div>

<!-- Navigation -->
<div class="nav-buttons">
  <button onclick="location.href='index.html'"><i class="fas fa-home"></i> Home</button>
  <button onclick="location.href='questions.html'"><i class="fas fa-question-circle"></i> Questions</button>
  <button onclick="location.href='answer.html'"><i class="fas fa-pen"></i> Answering</button>
  <button onclick="location.href='https://johnathanfermon.github.io/SImpleProfile/previews/JSCSSHTML.html'"><i class="fas fa-envelope"></i> Contact</button>
</div>

<h1>✧ Questions Sanctuary ✧</h1>

<!-- Theme Switcher -->
<div class="theme-switcher">
  <button class="theme-btn" onclick="setTheme('amoled')" title="AMOLED Dark">🌑</button>
  <button class="theme-btn" onclick="setTheme('warm')" title="Warm Golden">🌅</button>
  <button class="theme-btn" onclick="setTheme('light')" title="Soft Light">☀️</button>
</div>

<!-- Controls -->
<div class="controls">
  <input type="text" id="searchInput" class="search-bar" placeholder="Search questions or categories..." onkeyup="filterQuestions()">
  
  <select id="sortSelect" onchange="filterQuestions()" style="padding:14px 18px;border-radius:50px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:1em;">
    <option value="id">Sort by ID</option>
    <option value="emotional_asc">Emotional Value ↑</option>
    <option value="emotional_desc">Emotional Value ↓</option>
    <option value="category">Sort by Category</option>
  </select>
  
  <select id="groupSelect" onchange="filterQuestions()" style="padding:14px 18px;border-radius:50px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:1em;">
    <option value="">No Grouping</option>
    <option value="category">Group by Category</option>
    <option value="emotional">Group by Emotional Depth</option>
  </select>
</div>

<!-- Questions Container -->
<div class="stats-container" id="questionsContainer">
  <div class="loader" style="grid-column:1/-1;text-align:center;">Loading heartfelt questions...</div>
</div>

<script>
// Data
let allQuestions = [];

// Themes
function setTheme(theme) {
  document.body.className = theme;
  localStorage.setItem('theme', theme);
  if (theme === 'amoled') initSparkleTrail();
  else document.getElementById('sparkle-trail').style.display = 'none';
}

// Sparkle Trail (AMOLED)
let canvas, ctx, particles = [];
function initSparkleTrail() {
  canvas = document.getElementById('sparkle-trail');
  ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = 'block';
  
  document.addEventListener('mousemove', (e) => {
    for(let i=0; i<6; i++){
      particles.push({
        x: e.clientX,
        y: e.clientY,
        size: Math.random()*5 + 2,
        speedX: Math.random()*3 - 1.5,
        speedY: Math.random()*3 - 2,
        life: 45 + Math.random()*25
      });
    }
  });
  
  setInterval(() => {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=particles.length-1; i>=0; i--){
      let p = particles[i];
      p.x += p.speedX;
      p.y += p.speedY;
      p.life--;
      p.size *= 0.97;
      if(p.life <= 0 || p.size <= 0.3) {
        particles.splice(i,1); continue;
      }
      ctx.fillStyle = `hsla(48, 100%, 75%, ${p.life/60})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
  }, 1000/60);
}

// Particles Background
function createParticles() {
  const container = document.getElementById('particles');
  for(let i=0; i<35; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.width = p.style.height = Math.random()*8 + 4 + 'px';
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (Math.random()*30 + 20) + 's';
    p.style.animationDelay = '-' + Math.random()*40 + 's';
    container.appendChild(p);
  }
}

// Fetch Questions
async function fetchQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#ffd700;">Loading your questions with care...</div>';
  
  try {
    const res = await fetch('http://localhost:5000/api/questions');
    if(!res.ok) throw new Error();
    allQuestions = await res.json();
    filterQuestions();
  } catch(e) {
    container.innerHTML = '<p style="color:#ff6b6b;grid-column:1/-1;text-align:center;">Could not reach the sanctuary. Please ensure the server is running.</p>';
  }
}

// Main Filter + Display
function filterQuestions() {
  let filtered = [...allQuestions];
  const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  const sortMode = document.getElementById('sortSelect').value;
  const groupMode = document.getElementById('groupSelect').value;

  // Search
  if(searchTerm) {
    filtered = filtered.filter(q => 
      q.question_text.toLowerCase().includes(searchTerm) ||
      (q.category && q.category.toLowerCase().includes(searchTerm))
    );
  }

  // Sort
  if(sortMode === 'emotional_asc') {
    filtered.sort((a,b) => (a.emotional_value||0) - (b.emotional_value||0));
  } else if(sortMode === 'emotional_desc') {
    filtered.sort((a,b) => (b.emotional_value||0) - (a.emotional_value||0));
  } else if(sortMode === 'category') {
    filtered.sort((a,b) => (a.category||'').localeCompare(b.category||''));
  } // default ID sort

  // Render
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  if(filtered.length === 0) {
    container.innerHTML = `<p style="grid-column:1/-1;text-align:center;opacity:0.7;">No questions found matching your search. Try different words.</p>`;
    return;
  }

  if(groupMode) {
    const groups = {};
    filtered.forEach(q => {
      let key = groupMode === 'category' ? (q.category || 'Uncategorized') : 
                (q.emotional_value >=7 ? 'Deep (7-10)' : q.emotional_value >=4 ? 'Moderate (4-6)' : 'Gentle (1-3)');
      if(!groups[key]) groups[key] = [];
      groups[key].push(q);
    });

    Object.keys(groups).sort().forEach(key => {
      const header = document.createElement('div');
      header.className = 'group-header';
      header.innerHTML = `<i class="fas fa-layer-group"></i> ${key} <span style="font-size:0.6em;opacity:0.6;">(${groups[key].length})</span>`;
      container.appendChild(header);

      groups[key].forEach(q => createCard(q, container));
    });
  } else {
    filtered.forEach(q => createCard(q, container));
  }
}

function createCard(q, container) {
  const card = document.createElement('div');
  card.className = 'stat-card';
  card.innerHTML = `
    <h2>Q#${q.q_id} <span style="float:right;font-size:0.7em;opacity:0.7;">${q.category||''}</span></h2>
    <p>${q.question_text}</p>
    <small>❤️ Emotional Depth: <strong>${q.emotional_value || '—'}</strong></small>
  `;
  card.onclick = () => alert(`Reflection Prompt:\n\n${q.question_text}\n\nTake a deep breath and journal your thoughts... 💛`);
  container.appendChild(card);
}

// Sidebar
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function showHelpSection(n) {
  const content = document.getElementById('help-content');
  let html = '';
  if(n===1) html = `<h3>Emotional Value</h3><p>1-3: Gentle daily reflections<br>4-6: Deeper personal growth<br>7-10: Soul-stirring life questions</p>`;
  else if(n===2) html = `<h3>How to Use</h3><p>Search • Sort • Group • Click cards for prompts. Switch themes for different moods.</p>`;
  else html = `<h3>Daily Tip</h3><p>Answer one question each morning. Let your heart speak freely. You are enough.</p>`;
  content.innerHTML = html + '<button onclick="toggleSidebar()" style="margin-top:20px;padding:10px 20px;">Close Guide</button>';
}

// Init
window.onload = () => {
  createParticles();
  const savedTheme = localStorage.getItem('theme') || 'amoled';
  setTheme(savedTheme);
  fetchQuestions();
  
  // Resize handler for canvas
  window.addEventListener('resize', () => {
    if(canvas) {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
  });
};
</script>
</body>
</html>
